<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration Form</title>
  <style>
    body {
      background-color: #ffe6e6;
      font-family: Arial, sans-serif;
    }

    h2 {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
    }

    form {
      width: 600px;
      margin: 20px auto;
      background-color: white;
      border-radius: 8px;
      padding: 20px 40px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    label {
      display: inline-block;
      width: 150px;
      margin-top: 10px;
      font-weight: bold;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="date"],
    select,
    textarea {
      width: 60%;
      padding: 5px;
      margin-top: 5px;
    }

    input[type="file"] {
      margin-top: 5px;
    }

    textarea {
      height: 60px;
      resize: none;
    }

    .name-field input {
      width: 45%;
      margin-right: 10px;
    }

    .dob-field select {
      width: 20%;
    }

    .mobile-field input[type="text"] {
      width: 45%;
    }

    .gender-field input,
    .dept-field input {
      margin-left: 10px;
    }

    .btn {
      text-align: center;
      margin-top: 20px;
    }

    input[type="submit"] {
      padding: 8px 20px;
      border: none;
      background-color: #ff9999;
      color: white;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }

    input[type="submit"]:hover {
      background-color: #ff6666;
    }
  </style>
</head>
<body>
  <h2>Student Registration Form</h2>
  <form>
    <label>Roll no. :</label>
    <input type="text" name="roll"><br>

    <label>Student name :</label>
    <div class="name-field">
      <input type="text" placeholder="First Name" name="fname">
      <input type="text" placeholder="Last Name" name="lname">
    </div><br>

    <label>Father's name :</label>
    <input type="text" name="father"><br>

    <label>Date of birth :</label>
    <div class="dob-field">
      <select name="day">
        <option>Day</option>
        <!-- Options 1–31 -->
        <script>
          for (let i = 1; i <= 31; i++) {
            document.write(`<option>${i}</option>`);
          }
        </script>
      </select>
      <select name="month">
        <option>Month</option>
        <option>Jan</option><option>Feb</option><option>Mar</option>
        <option>Apr</option><option>May</option><option>Jun</option>
        <option>Jul</option><option>Aug</option><option>Sep</option>
        <option>Oct</option><option>Nov</option><option>Dec</option>
      </select>
      <select name="year">
        <option>Year</option>
        <script>
          for (let i = 1980; i <= 2025; i++) {
            document.write(`<option>${i}</option>`);
          }
        </script>
      </select>
      <span>(DD-MM-YYYY)</span>
    </div><br>

    <label>Mobile no. :</label>
    <div class="mobile-field">
      <select name="country">
        <option>+91</option>
      </select>
      <input type="text" name="mobile">
    </div><br>

    <label>Email id :</label>
    <input type="email" name="email"><br>

    <label>Password :</label>
    <input type="password" name="password"><br>

    <label>Gender :</label>
    <div class="gender-field">
      <input type="radio" name="gender" value="male"> Male
      <input type="radio" name="gender" value="female"> Female
    </div><br>

    <label>Department :</label>
    <div class="dept-field">
      <input type="checkbox" name="dept" value="CSE"> CSE
      <input type="checkbox" name="dept" value="IT"> IT
      <input type="checkbox" name="dept" value="ECE"> ECE
      <input type="checkbox" name="dept" value="Civil"> Civil
      <input type="checkbox" name="dept" value="Mech"> Mech
    </div><br>

    <label>Course :</label>
    <select name="course">
      <option>Select Current Course's</option>
      <option>B.Tech</option>
      <option>M.Tech</option>
      <option>BCA</option>
      <option>MCA</option>
      <option>B.Sc</option>
    </select><br>

    <label>Student photo :</label>
    <input type="file" name="photo"><br>

    <label>City :</label>
    <input type="text" name="city"><br>

    <label>Address :</label>
    <textarea name="address"></textarea><br>

    <div class="btn">
      <input type="submit" value="Register">
    </div>
  </form>
</body>
</html>
